name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nicfinder
          POSTGRES_PASSWORD: nicfinder_dev
          POSTGRES_DB: nicfinder_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nicfinder"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Build/test never need a real app database; the test harness only uses
      # TEST_DATABASE_URL (name must contain "test" — it is reset every run).
      DATABASE_URL: postgresql://nicfinder:nicfinder_dev@localhost:5432/nicfinder_test
      TEST_DATABASE_URL: postgresql://nicfinder:nicfinder_dev@localhost:5432/nicfinder_test
      SESSION_SECRET: ci-only-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (vitest unit/integration)
        run: npm test

      - name: Production build
        run: npm run build
